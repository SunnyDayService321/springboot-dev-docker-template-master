name: Java CI with Maven

on:
  push:
    branches: [ "master" ]  # masterブランチにプッシュされたら実行
  pull_request:
    branches: [ "master" ]  # masterへのプルリクエスト作成時も実行

jobs:
  build:
    runs-on: ubuntu-latest  # GitHubが用意するLinux環境で動かす

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # あなたのコードを仮想環境にコピー

    - name: Set up JDK 11
      uses: actions/setup-java@v4

      with:
        java-version: '11'       # Java 11を使用
        distribution: 'temurin'
        cache: maven             # 2回目以降のビルドを速くする

    - name: Build with Maven
      # コンパイルとテストを実行して、アプリが壊れていないか確認する
      working-directory: ./volumes/app
      run: mvn -B clean package

    - name: Deploy to EC2
    # masterブランチにプッシュされた時だけ実行
      if: github.ref == 'refs/heads/master'
      env:
        SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ec2-user
      run: |
        # 1. ~/.ssh ディレクトリを作成
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        # 2. 秘密鍵を ~/.ssh/id_rsa に配置
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa  # 権限設定

        # 3. 接続先を known_hosts に登録（接続時の確認をスキップするため）
        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

        # 4. デプロイ実行（-i オプションなしで ~/.ssh/id_rsa が自動で使われます）
        scp ./volumes/app/target/*.jar ${USER}@${HOST}:/home/${USER}/app.jar

        # 5. アプリ起動
        ssh -n ${USER}@${HOST} "cd /home/ec2-user/app-project && sudo docker-compose down && sudo DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 docker-compose up -d --build"

